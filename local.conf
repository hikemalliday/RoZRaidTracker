server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect the bare path to the canonical trailing-slash form, then
    # prefix-match everything under /admin/ so /admin and /admin/... both
    # reach Django instead of falling through to the frontend SPA.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django-owned static (admin, DRF browsable API) is served by the app
    # container's runserver, not bundled into the nginx image. More-specific
    # prefixes win, so these take priority over the frontend /static/ below.
    location /static/admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/rest_framework/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /static/;
    }

    location / {
        try_files $uri $uri/ /static/index.html;
    }
}