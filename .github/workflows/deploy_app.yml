name: deploy-app
run-name: SSH into server and rebuild app
on:
  push:
    branches:
      - main

jobs:
  deploy:
    needs: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_IP }} << 'EOF'
            set -e
            set -x
            cd /home/mike/projects/RoZRaidTracker
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose down
            docker compose build
            docker compose up -d
          EOF
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
         node-version: '20'
         cache: 'npm'
         cache-dependency-path: frontend/package-lock.json
    - name: Run Tests
      run: |
        npm ci
        npm test -- --run
