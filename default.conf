server {
    listen 80;
    server_name  zekraidtools.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location / {
        try_files $uri $uri/ /static/index.html;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect the bare path to the canonical trailing-slash form, then
    # prefix-match everything under /admin/ so /admin and /admin/... both
    # reach Django instead of falling through to the frontend SPA.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django-owned static (admin, DRF browsable API) is served by the app
    # container's runserver, not bundled into the nginx image. More-specific
    # prefixes win, so these take priority over the frontend /static/ below.
    location /static/admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/rest_framework/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /static/;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zekraidtools.com;
    ssl_certificate /etc/letsencrypt/live/zekraidtools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zekraidtools.com/privkey.pem;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_ssl_session_reuse off;
        proxy_set_header Host $http_host;
        proxy_pass_header Server;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        try_files $uri $uri/ /static/index.html;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect the bare path to the canonical trailing-slash form, then
    # prefix-match everything under /admin/ so /admin and /admin/... both
    # reach Django instead of falling through to the frontend SPA.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django-owned static (admin, DRF browsable API) is served by the app
    # container's runserver, not bundled into the nginx image. More-specific
    # prefixes win, so these take priority over the frontend /static/ below.
    location /static/admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/rest_framework/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /static/;
    }
}