services:
  app:
    build:
      context: .
      args:
        VITE_MODE: emulate-prod
    container_name: django-app
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DB=${DJANGO_DB:-default}
    volumes:
      - ./roz_loot_tracker/db.sqlite3:/roz_loot_tracker/db.sqlite3
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MODE: emulate-prod
    container_name: nginx-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app