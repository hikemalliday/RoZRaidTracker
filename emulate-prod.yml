services:
  app:
    build:
      context: .
      args:
        VITE_MODE: production
    container_name: django-app
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DB=${DJANGO_DB:-default}
    env_file:
      - ./frontend/.env.local

  nginx:
    image: nginx:stable
    container_name: nginx-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./local.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/static
    depends_on:
      - app